name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        run: claude plugin validate . --strict
      - name: Validate library files against the schema
        run: |
          npm install -g ajv-cli ajv-formats
          ajv validate -c ajv-formats -s schemas/library.schema.json -d library/default.json
          ajv validate -c ajv-formats -s schemas/library.schema.json -d library/examples.json
      - name: Steps library embedded in the Kata Library page
        run: node scripts/embed-examples.mjs --check
      - name: Plugin tests
        run: claude plugin test .
